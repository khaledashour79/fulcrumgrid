<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://region1.google-analytics.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-src 'none'" />

  <!-- Google tag (gtag.js) — REPLACE G-XXXXXXXXXX WITH YOUR FULCRUMGRID GA4 MEASUREMENT ID -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('consent','default',{'ad_storage':'denied','analytics_storage':'denied','wait_for_update':500});
    try{if(localStorage.getItem('fg_consent')==='granted'){gtag('consent','update',{'ad_storage':'granted','analytics_storage':'granted'});}}catch(e){}
    gtag('config', 'G-XXXXXXXXXX');
  </script>

  <title>Page not found — FulcrumGrid</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0b1020; --text:#e7ecf6; --muted:#9aa6c6; --teal:#5eead4; --indigo:#6366f1; }
    * { margin:0; box-sizing:border-box; }
    body {
      min-height:100vh; display:grid; place-items:center; text-align:center; padding:24px;
      background:
        radial-gradient(600px 300px at 30% 10%, rgba(94,234,212,0.14), transparent 70%),
        radial-gradient(700px 340px at 80% 20%, rgba(99,102,241,0.2), transparent 70%),
        var(--bg);
      color:var(--text); font-family:'Inter',system-ui,sans-serif;
    }
    .code { font-family:'Space Grotesk',sans-serif; font-size:clamp(4rem,16vw,8rem); font-weight:700; letter-spacing:-0.04em;
      background:linear-gradient(100deg,var(--teal),var(--indigo)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    h1 { font-family:'Space Grotesk',sans-serif; font-size:1.6rem; margin:8px 0 12px; }
    p { color:var(--muted); max-width:420px; margin:0 auto 26px; }
    a { display:inline-flex; align-items:center; gap:8px; padding:13px 24px; border-radius:11px; font-weight:600;
      color:#fff; text-decoration:none; background:linear-gradient(135deg,var(--indigo),#4f46e5); box-shadow:0 12px 30px -12px rgba(99,102,241,0.8); }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>This page isn't on the grid</h1>
    <p>The page you're looking for may have moved or never existed. Let's get you back on track.</p>
    <a href="/">Back to FulcrumGrid</a>
  </main>
  <script src="assets/js/consent.js" defer></script>
</body>
</html>
